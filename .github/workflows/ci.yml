name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu"]
        jvm: ["17", "21", "25", "26"]
        scala: ["2.12", "3"]
        include:
          - os: windows
            jvm: 17
            scala: "3"
    name: ${{ matrix.os }} / JDK ${{ matrix.jvm }} / ${{ matrix.scala == '2.12' && 'sbt 1.x' || 'sbt 2.x' }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v9
        with:
          matrix: "${{ matrix.os }}-${{ matrix.scala }}"
          # most-coverage cells write it, others only read: JDK 25 (runs every
          # fixture, unlike JDK 17) and the Windows cell (the only one for that OS)
          cacheMode: ${{ (matrix.jvm == '25' || matrix.os == 'windows') && 'write' || 'read' }}
      - uses: coursier/setup-action@v3
        with:
          apps: sbt
          jvm: temurin:${{ matrix.jvm }}
      - if: matrix.jvm == '17'
        run: rm -r scripted/src/sbt-test/skip-sbt1.4
      - if: matrix.os == 'windows'
        run: rm -r scripted/src/sbt-test/skip-windows
      - run: sbt "...@scalaBinaryVersion=${{ matrix.scala }}/test"
      - run: sbt "...@scalaBinaryVersion=${{ matrix.scala }}/scripted"
  formatting:
    name: Scalafmt and Scalafix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3
        with:
          apps: sbt
      - run: ./bin/scalafmt --test
      - run: sbt "scalafixAll --check"
