name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu"]
        jvm: ["17", "21", "25", "26"]
        scala: ["2.12.x", "3.x"]
        include:
          - os: windows
            jvm: 17
            scala: 3.x
    name: ${{ matrix.os }} / JDK ${{ matrix.jvm }} / Scala ${{ matrix.scala }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/setup-action@v3
        with:
          apps: sbt
          jvm: temurin:${{ matrix.jvm }}
      - if: matrix.jvm == '17'
        run: rm -r src/sbt-test/skip-sbt1.4
      - if: matrix.os == 'windows'
        run: rm -r src/sbt-test/skip-windows
      - run: sbt ++${{ matrix.scala }} test scripted
  formatting:
    name: Scalafmt and Scalafix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/setup-action@v3
        with:
          apps: sbt
      - run: ./bin/scalafmt --test
      - run: sbt "scalafixAll --check"
