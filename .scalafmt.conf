version = "3.11.5"
project.git=true
align.preset=none
assumeStandardLibraryStripMargin = true
runner.dialect = scala3
onTestFailure = "To fix this, run `./bin/scalafmt` from the project base directory"

fileOverride {
  "glob:**/sbt-test/sbt-scalafix/cross-build/scala212/src/**/*.scala" {
    runner.dialect = scala213
  }
  "glob:**/sbt-test/sbt-scalafix/custom-src-directory/app/ProcedureSyntax.scala" {
    runner.dialect = scala213
  }
  "glob:**/sbt-test/skip-sbt1.4/caching/files/ProcedureSyntax.scala" {
    runner.dialect = scala213
  }
  "glob:**/sbt-test/skip-sbt1.4/scalafixEnable/scala210/src/**/*.scala" {
    runner.dialect = scala213
  }
  "glob:**/sbt-test/skip-sbt1.4/scalafixEnable/scala211/src/**/*.scala" {
    runner.dialect = scala213
  }
  "glob:**/sbt-test/skip-sbt1.4/scalafixEnable/scala212/src/**/*.scala" {
    runner.dialect = scala213
  }
  "glob:**/sbt-test/skip-windows/relax-scalacOptions/src/main/scala/UnusedImportAndProcedureSyntax.scala" {
    runner.dialect = scala213
  }
}
